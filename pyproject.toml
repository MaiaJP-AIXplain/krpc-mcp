[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krpc-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for kRPC — control Kerbal Space Program with Claude AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "krpc>=0.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
krpc-mcp = "krpc_mcp.server:main"

[tool.hatch.build]
exclude = [
    ".venv/**",
    "venv/**",
    ".env/**",
    "**/.venv/**",
    "**/venv/**",
    "**/.env/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krpc_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
